name: Integrate project ZIP sharing into VERA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'advanced-save-export.js'
      - '.github/workflows/advanced-export.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement into existing app without replacing VERA engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('index.html')
          html = app.read_text(encoding='utf-8')
          tag = '<script src="./advanced-save-export.js" defer></script>'
          if tag not in html:
              assert '</body>' in html, 'App has no closing body; cannot inject safely'
              html = html.replace('</body>', tag + '\n</body>', 1)
              app.write_text(html, encoding='utf-8')
          sw = Path('sw.js')
          if sw.exists():
              js = sw.read_text(encoding='utf-8')
              if "'./advanced-save-export.js'" not in js:
                  js = js.replace("'./', './index.html'", "'./', './index.html', './advanced-save-export.js'", 1)
              js = js.replace("'vproj-20261102-v2-1-core'", "'vproj-20261117-sharing-v1'")
              sw.write_text(js, encoding='utf-8')
          PY
      - name: Commit updated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Enable project ZIP/CSV sharing in existing Mergin-linked VERA [skip ci]"
            git push
          fi
